version: '3.8'

services:
  app:
    image: rifatsoftdev/auth-server
    build: .
    env_file:
      - /etc/env/.env
    container_name: auth-server
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /etc/secrets:/etc/secrets:ro
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - redis

  redis:
    image: redis
    container_name: redis-server
    ports:
      - "6379:6379"

  
